<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where yatoi sits</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · yatoi</p>
    <h1>Where yatoi sits in an application</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="yatoi-architecture-title yatoi-architecture-desc">
      <title id="yatoi-architecture-title">Where yatoi sits in an application</title>
      <desc id="yatoi-architecture-desc">A host — React app, Vue app, or Node process — loads plugins into one kernel and observes it. Provider plugins provide capabilities, feature plugins inject them and contribute routes, tools or views; both hold external resources that defer reverses. When a capability disappears the kernel cascades: dependent plugins stop. Code delivery and DI containers sit beside the kernel, not inside it.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- zones -->
      <rect x="48" y="40" width="680" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="48" y="44" width="196" height="12" rx="2" fill="#f5f5f5"/>
      <text x="146" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HOST · ANY ONE OF · OWNS LOAD/UNLOAD</text>

      <rect x="48" y="440" width="480" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="56" y="444" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="156" y="453" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PLUGINS · BUNDLED OR LOADED AT RUNTIME</text>

      <!-- arrows: host → kernel -->
      <path d="M172,144 V180 Q172,188 180,188 H342 Q350,188 350,196 V232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M392,144 V180 Q392,188 400,188 H452 Q460,188 460,196 V232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="612" y1="144" x2="612" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M100,160 V196 Q100,204 108,204 H262 Q270,204 270,212 V232" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <rect x="230" y="168" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="177" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OBSERVE</text>
      <rect x="400" y="168" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="426" y="177" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OBSERVE</text>
      <rect x="620" y="182" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="624" y="191" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">OBSERVE</text>
      <rect x="145" y="210" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="185" y="219" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOAD / UNLOAD</text>

      <!-- arrows: plugins → kernel -->
      <path d="M172,472 V380 Q172,372 180,372 H352 Q360,372 360,364 V344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M396,472 V396 Q396,388 404,388 H452 Q460,388 460,380 V344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="240" y="378" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="266" y="387" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROVIDE</text>
      <rect x="394" y="394" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="428" y="403" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONTRIBUTE</text>

      <!-- arrow: kernel → feature plugins, cascade unload (accent) -->
      <path d="M560,344 V412 Q560,420 552,420 H444 Q436,420 436,428 V472" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <rect x="468" y="428" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="498" y="437" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CASCADE</text>

      <!-- arrow: kernel → resources, defer reverses -->
      <line x1="680" y1="288" x2="760" y2="288" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="692" y="268" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="277" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVERSES</text>

      <!-- arrow: plugins → resources, hold -->
      <path d="M528,468 H852 Q860,468 860,460 V324" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="664" y="448" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="690" y="457" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOLD</text>

      <!-- arrow: delivery/DI → plugins -->
      <line x1="760" y1="508" x2="528" y2="508" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="614" y="488" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="644" y="497" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DELIVERS</text>

      <!-- hosts -->
      <rect x="72" y="72" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="72" width="200" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="80" y="78" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="98" y="87" fill="rgba(122,131,153,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REACT</text>
      <text x="172" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">React app</text>
      <text x="172" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@yatoi/react · &lt;Requires&gt; &lt;Slot&gt;</text>

      <rect x="292" y="72" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="292" y="72" width="200" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="300" y="78" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="314" y="87" fill="rgba(122,131,153,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VUE</text>
      <text x="392" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vue app</text>
      <text x="392" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@yatoi/vue · &lt;Requires&gt; &lt;Slot&gt;</text>

      <rect x="512" y="72" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="72" width="200" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="520" y="78" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="536" y="87" fill="rgba(122,131,153,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
      <text x="612" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node process</text>
      <text x="612" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agent host · server · kernel.get()</text>

      <!-- kernel (focal) -->
      <rect x="240" y="232" width="440" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="232" width="440" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="248" y="238" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="268" y="247" fill="rgba(235,108,54,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KERNEL</text>
      <text x="460" y="259" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">@yatoi/kernel</text>
      <text x="640" y="247" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO DOM · NO FRAMEWORK</text>

      <rect x="310" y="268" width="300" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.30)" stroke-width="0.8"/>
      <text x="460" y="279" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">capability graph · inject → provide · collections</text>
      <rect x="310" y="292" width="300" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.30)" stroke-width="0.8"/>
      <text x="460" y="303" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">plugin scopes · load · defer · dispose in reverse</text>
      <rect x="310" y="316" width="300" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.30)" stroke-width="0.8"/>
      <text x="460" y="327" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">observable state · present · loading · absent</text>

      <!-- external resources -->
      <rect x="760" y="252" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="252" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="768" y="258" width="60" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="798" y="267" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESOURCES</text>
      <text x="860" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">External resources</text>
      <text x="860" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">connections · credentials · timers</text>

      <!-- plugins -->
      <rect x="72" y="472" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="472" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="80" y="478" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="106" y="487" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROVIDER</text>
      <text x="172" y="512" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider plugins</text>
      <text x="172" y="530" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">e.g. config · auth · database</text>

      <rect x="296" y="472" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="296" y="472" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="304" y="478" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="328" y="487" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FEATURE</text>
      <text x="396" y="512" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Feature plugins</text>
      <text x="396" y="530" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">e.g. routes · tools · slot items</text>

      <!-- code delivery / DI (beside, not inside) -->
      <rect x="760" y="472" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="472" width="200" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="768" y="478" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="790" y="487" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BESIDE</text>
      <text x="860" y="512" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Code delivery · DI container</text>
      <text x="860" y="530" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bundler · import(url) · Awilix</text>

      <!-- legend -->
      <line x1="30" y1="592" x2="970" y2="592" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="110" y1="605" x2="134" y2="605" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="142" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">observe · provide · contribute · hold</text>

      <line x1="360" y1="605" x2="384" y2="605" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="392" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">load/unload · defer reverses · delivers code</text>

      <line x1="650" y1="605" x2="674" y2="605" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <text x="682" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">capability gone → dependents stop, effects undone</text>
    </svg>
  </div>
</body>
</html>
